<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3 個全球美食推薦</title>

<style>

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f8f9fa;
    margin: 0;
    padding: 40px 20px;
}

h1 {
    text-align: center;
    color: #2c3e50;
    margin-bottom: 40px;
}

.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 25px;
    max-width: 1000px;
    margin: 0 auto;
}

.food-card {
    background-color: #ffffff;
    border-radius: 12px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.1);
    width: 220px;
    padding: 25px;
    text-align: center;
    cursor: pointer;
    transition: 0.3s;
}

.food-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.15);
}

.emoji {
    font-size: 50px;
}

.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal-content {
    background-color: #fff;
    padding: 20px;
    border-radius: 12px;
    max-width: 500px;
    width: 90%;
    text-align: center;
    position: relative;
    max-height: 80vh;
    overflow-y: auto;
}

.modal-content img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 8px;
}

.food-item {
    margin-bottom: 25px;
}

.food-item h4 {
    margin: 10px 0;
    color: #e67e22;
}

.food-item a {
    display: inline-block;
    margin-top: 5px;
    color: #3498db;
    text-decoration: none;
}

.close-btn,
.detail-close-btn {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 28px;
    cursor: pointer;
}

.food-image {
    cursor: pointer;
    transition: 0.3s;
}

.food-image:hover {
    transform: scale(1.03);
}

/* Detail Modal */

.detail-content {
    max-width: 650px;
    background: linear-gradient(135deg, #fff7e6, #ffe0b2);
    animation: popup 0.3s ease;
}

.detail-content img {
    width: 100%;
    height: 320px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 15px;
}

#detailTitle {
    color: #d35400;
    margin-bottom: 10px;
}

#detailText {
    font-size: 16px;
    line-height: 1.7;
    color: #444;
}

@keyframes popup {
    from {
        transform: scale(0.7);
        opacity: 0;
    }

    to {
        transform: scale(1);
        opacity: 1;
    }
}

</style>
</head>

<!-- First Modal -->

<div id="foodModal" class="modal">

    <div class="modal-content">

        <span class="close-btn">&times;</span>

        <h3 id="modalTitle"></h3>

        <div id="foodList"></div>

    </div>

</div>


<!-- Detail Modal -->

<div id="detailModal" class="modal">

    <div class="modal-content detail-content">

        <span class="detail-close-btn">&times;</span>

        <img id="detailImage" src="">

        <h2 id="detailTitle"></h2>

        <p id="detailText"></p>

    </div>

</div>


<script>

const cards = document.querySelectorAll('.food-card');

const modal = document.getElementById('foodModal');

const modalTitle = document.getElementById('modalTitle');

const foodList = document.getElementById('foodList');

const closeBtn = document.querySelector('.close-btn');


// OPEN FOOD LIST

cards.forEach(card => {

    card.addEventListener('click', () => {

        const foods = JSON.parse(card.getAttribute('data-foods'));

        const country = card.querySelector('h2').innerText;

        modalTitle.innerText = country + " 美食";

        foodList.innerHTML = "";

        foods.forEach(food => {

            const item = document.createElement('div');

            item.classList.add('food-item');

            item.innerHTML = `
                <h4>${food.name}</h4>

                <img 
                    src="${food.img}" 
                    class="food-image"

                    data-detailimg="${food.detailImg}"
                    data-desc="${food.desc}"
                    data-title="${food.name}"
                >

                <br>

                <a href="${food.map}" target="_blank">${food.loc}</a>
            `;

            foodList.appendChild(item);

        });

        modal.style.display = 'flex';

    });

});


// CLOSE FIRST MODAL

closeBtn.addEventListener('click', () => {

    modal.style.display = 'none';

});


// DETAIL MODAL

const detailModal = document.getElementById('detailModal');

const detailImage = document.getElementById('detailImage');

const detailTitle = document.getElementById('detailTitle');

const detailText = document.getElementById('detailText');

const detailCloseBtn = document.querySelector('.detail-close-btn');


// OPEN DETAIL

document.addEventListener('click', function(e){

    if(e.target.classList.contains('food-image')){

        detailImage.src = e.target.dataset.detailimg;

        detailTitle.innerText = e.target.dataset.title;

        detailText.innerText = e.target.dataset.desc;

        detailModal.style.display = 'flex';
    }

});


// CLOSE DETAIL

detailCloseBtn.addEventListener('click', () => {

    detailModal.style.display = 'none';

});


// CLICK OUTSIDE TO CLOSE

window.addEventListener('click', (event) => {

    if (event.target === modal) {

        modal.style.display = 'none';

    }

    if (event.target === detailModal) {

        detailModal.style.display = 'none';

    }

});

</script>

</body>
</html>
