<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東越泰 三國美食推廣 - 3D 浮雕地圖完整版</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    width: 100vw;
    overflow-x: hidden;

    /* 讓完整海報填滿整個螢幕背景 */
    background-image: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.4)), url('https//:images/11.png');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* 覆蓋於畫面中央的按鈕容器層 */
.map-container {
    position: relative;
    width: 100%;
    max-width: 1400px;
    height: 600px;
    margin-top: 40px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 0 50px;
}

/* 獨立的立體浮雕國家框架按鈕 */
.country-frame-btn {
    position: relative;
    width: 340px;
    height: 450px;
    background-color: rgba(243, 230, 206, 0.9); /* 復古羊皮紙色半透明底座 */
    border-radius: 20px;
    cursor: pointer;
    
    /* 3D 浮雕與陰影設計 */
    border: 4px solid #b8975a; 
    box-shadow: 
        0 15px 35px rgba(0,0,0,0.4),            
        inset 0 0 20px rgba(184, 151, 90, 0.3),  
        0 0 0 8px rgba(0, 0, 0, 0.2);            
        
    transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.4s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 25px 20px;
    overflow: hidden;
}

/* 滑鼠懸停時卡片拔起與發光特效 */
.country-frame-btn:hover {
    transform: translateY(-15px) scale(1.03);
    box-shadow: 
        0 30px 50px rgba(0,0,0,0.6), 
        inset 0 0 30px rgba(230, 180, 80, 0.5),
        0 0 20px rgba(241, 196, 15, 0.4);
    border-color: #f1c40f; 
}

/* 利用去背地形圖作為卡片內的焦點 */
.terrain-graphics {
    width: 100%;
    height: 240px;
    background-image: url('file_00000000e0bc72079981569fc8369855.png');
    background-repeat: no-repeat;
    background-size: 320% auto; 
    
    /* 讓地形圖在框架內產生浮雕邊緣陰影 */
    filter: drop-shadow(0 8px 12px rgba(0,0,0,0.45));
    transition: transform 0.4s ease, filter 0.4s ease;
}

.country-frame-btn:hover .terrain-graphics {
    transform: scale(1.08);
    filter: drop-shadow(0 12px 18px rgba(0,0,0,0.6)) brightness(1.1);
}

/* 精準擷取第二張去背圖中的三國地理形狀 */
.cambodia-map { background-position: 2% 43%; }
.vietnam-map { background-position: 50% 43%; }
.thailand-map { background-position: 98% 43%; }

.emoji {
    font-size: 32px;
    margin-bottom: 5px;
}

.country-title {
    margin: 10px 0 2px 0;
    font-size: 28px;
    font-weight: bold;
    color: #2c3e50;
    letter-spacing: 2px;
}

.country-subtitle {
    margin: 0;
    font-size: 16px;
    color: #e67e22;
    font-weight: 600;
}

.country-hint {
    margin-top: auto;
    font-size: 13px;
    color: #7f8c8d;
    font-style: italic;
}

/* Modals 彈窗樣式 */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.7);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal-content {
    background-color: #fff;
    padding: 30px 25px;
    border-radius: 16px;
    max-width: 550px;
    width: 90%;
    text-align: center;
    position: relative;
    max-height: 85vh;
    overflow-y: auto;
    line-height: 1.6;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.modal-content h3 {
    font-size: 24px;
    color: #2c3e50;
    margin-top: 0;
    margin-bottom: 20px;
    border-bottom: 2px solid #f1c40f;
    padding-bottom: 10px;
}

.modal-content img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 8px;
    margin-top: 10px;
}

.food-item {
    margin-bottom: 30px;
    border-bottom: 1px solid #eee;
    padding-bottom: 20px;
    text-align: left;
}

.food-item:last-child { 
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
}

.food-item h4 {
    margin: 0 0 10px 0;
    color: #d35400;
    font-size: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.food-item a {
    display: inline-block;
    margin-top: 10px;
    color: #3498db;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
}
.food-item a:hover { text-decoration: underline; }

.close-btn, .detail-close-btn {
    position: absolute;
    top: 12px;
    right: 20px;
    font-size: 32px;
    cursor: pointer;
    color: #95a5a6;
    transition: color 0.2s;
    line-height: 1;
}
.close-btn:hover, .detail-close-btn:hover { color: #34495e; }

.food-image {
    cursor: pointer;
    transition: transform 0.3s ease;
}
.food-image:hover { transform: scale(1.02); }

/* Detail Modal 第二層詳細規格 */
.detail-content {
    max-width: 650px;
    background: linear-gradient(135deg, #fff7e6, #ffe0b2);
    animation: popup 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.detail-content img {
    width: 100%;
    height: 340px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.15);
}

#detailTitle { color: #d35400; margin-bottom: 15px; font-size: 26px; text-align: center; }
#detailText { font-size: 16px; line-height: 1.7; color: #444; text-align: left; white-space: pre-line; }

@keyframes popup {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

/* 響應式手機板調整 */
@media(max-width: 1024px) {
    .map-container {
        flex-direction: column;
        height: auto;
        gap: 40px;
        padding: 40px 20px;
    }
}
</style>
</head>

        <div class="emoji">🌶️</div>
        <div class="country-title">泰國</div>
        <div class="country-subtitle">THAILAND</div>

        <div class="country-hint">點擊查看美食 ➔</div>
    </div>

</div>

<div id="foodModal" class="modal">
    <div class="modal-content">
        <span class="close-btn">×</span>
        <h3 id="modalTitle"></h3>
        <div id="foodList"></div>
    </div>
</div>

<div id="detailModal" class="modal">
    <div class="modal-content detail-content">
        <span class="detail-close-btn">×</span>
        <img id="detailImage" src="">
        <h2 id="detailTitle"></h2>
        <p id="detailText"></p>
    </div>
</div>

<script>
const buttons = document.querySelectorAll('.country-frame-btn');
const modal = document.getElementById('foodModal');
const modalTitle = document.getElementById('modalTitle');
const foodList = document.getElementById('foodList');
const closeBtn = document.querySelector('.close-btn');

// 點擊 3D 國家按鈕：讀取該按鈕標籤內的 data-foods 完整資料並顯示
buttons.forEach(btn => {
    btn.addEventListener('click', () => {
        const foods = JSON.parse(btn.getAttribute('data-foods'));
        const country = btn.querySelector('.country-title').innerText;
        
        modalTitle.innerText = country + " 精選美食";
        foodList.innerHTML = "";

        foods.forEach(food => {
            const item = document.createElement('div');
            item.classList.add('food-item');
            item.innerHTML = `
                <h4>${food.name}</h4>
                <img src="${food.img}" class="food-image" 
                     data-detailimg="${food.detailImg}" 
                     data-desc="${food.desc}" 
                     data-title="${food.name}">
                <br>
                <a href="${food.map}" target="_blank">${food.loc}</a>
            `;
            foodList.appendChild(item);
        });
        modal.style.display = 'flex';
    });
});

// 關閉第一層美食清單
closeBtn.addEventListener('click', () => { modal.style.display = 'none'; });

// 第二層詳細資訊控制（食譜與背景故事）
const detailModal = document.getElementById('detailModal');
const detailImage = document.getElementById('detailImage');
const detailTitle = document.getElementById('detailTitle');
const detailText = document.getElementById('detailText');
const detailCloseBtn = document.querySelector('.detail-close-btn');

// 動態事件監聽：點擊清單中的圖片開啟詳細頁面
document.addEventListener('click', function(e){
    if(e.target.classList.contains('food-image')){
        detailImage.src = e.target.dataset.detailimg;
        detailTitle.innerText = e.target.dataset.title;
        detailText.innerText = e.target.dataset.desc;
        detailModal.style.display = 'flex';
    }
});

// 關閉第二層詳細頁面
detailCloseBtn.addEventListener('click', () => { detailModal.style.display = 'none'; });

// 點擊視窗外部（暗色背景處）直接關閉對應的彈窗
window.addEventListener('click', (event) => {
    if (event.target === modal) modal.style.display = 'none';
    if (event.target === detailModal) detailModal.style.display = 'none';
});
</script>

</body>
</html>
